name: Build and Publish Docker Images

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for tag bumping

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # Automatically bumps the semver patch version (e.g., 1.0.0 -> 1.0.1)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Alpine Image (Default)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            amithalder/clamav-restapi:latest
            amithalder/clamav-restapi:${{ steps.tag_version.outputs.new_tag }}
            
      - name: Build and push Rocky Linux Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./centos.Dockerfile
          push: true
          tags: |
            amithalder/clamav-restapi:rocky-latest
            amithalder/clamav-restapi:rocky-${{ steps.tag_version.outputs.new_tag }}
